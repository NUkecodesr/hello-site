<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { margin-bottom: 2rem; }
        details { margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
        summary { cursor: pointer; font-weight: 600; }
        details p { margin-top: 0.5rem; color: #444; }
    </style>
</head>
<body>
    <h1>Hello!</h1>

    <h2>FAQ</h2>

    <details>
        <summary>What is your name?</summary>
        <p>My name is Zotac.</p>
    </details>

    <details>
        <summary>Why is your name Zotac?</summary>
        <p>Because Zotac is the best name there is.</p>
    </details>

    <details>
        <summary>Can I also be called Zotac?</summary>
        <p>No. There is only one Zotac.</p>
    </details>

    <details>
        <summary>How do you pronounce Zotac?</summary>
        <p>ZO-tac. Rhymes with "go back."</p>
    </details>

    <details>
        <summary>Is Zotac your real name?</summary>
        <p>It's the only name that matters.</p>
    </details>
</body>
</html>
